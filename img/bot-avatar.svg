<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="NB频道AI助手">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d8dff"/>
      <stop offset="55%" stop-color="#7a6bff"/>
      <stop offset="100%" stop-color="#b45cff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".78"/>
    </linearGradient>
  </defs>

  <!-- 圆底 -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#g1)"/>

  <!-- 光晕 -->
  <circle cx="34" cy="30" r="34" fill="#ffffff" opacity=".12"/>
  <circle cx="104" cy="104" r="30" fill="#000000" opacity=".10"/>

  <!-- 对话气泡 -->
  <path d="M32 34h64a10 10 0 0 1 10 10v34a10 10 0 0 1-10 10H62l-16 14v-14h-14a10 10 0 0 1-10-10V44a10 10 0 0 1 10-10z"
        fill="url(#g2)"/>

  <!-- 眼睛（两个圆点，代表机器人） -->
  <circle cx="52" cy="60" r="6" fill="#3d5afe"/>
  <circle cx="76" cy="60" r="6" fill="#3d5afe"/>

  <!-- AI 字样 -->
  <text x="64" y="86" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif"
        font-size="20" font-weight="700" letter-spacing="2" fill="#5b4bff">AI</text>

  <!-- 天线 -->
  <line x1="64" y1="20" x2="64" y2="34" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  <circle cx="64" cy="17" r="5" fill="#ffffff" opacity=".95"/>
</svg>
