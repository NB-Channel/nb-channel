<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<title>扫一扫 - NB频道</title>
<script>
    (function () {
        try {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        } catch (e) {}
    })();
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #f7f8fa; --ink: #1a1d23; --ink-soft: #5a6270; --ink-faint: #8b93a3;
    --line: #e8eaee; --brand: #3b82f6; --card: #ffffff;
    --radius-lg: 20px; --radius-md: 14px;
    --shadow-1: 0 1px 2px rgba(16,24,40,.04), 0 4px 12px rgba(16,24,40,.06);
}
html.dark { color-scheme: dark;
    --bg: #0a101f; --ink: #e5eaf3; --ink-soft: #9aa7bd; --ink-faint: #64748b;
    --line: rgba(148,163,184,.16); --card: #101a2e;
    --shadow-1: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.28);
}
body {
    background: var(--bg); color: var(--ink); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
}
.wrap { width: 100%; max-width: 420px; }
.brand { display: flex; align-items: center; gap: 9px; justify-content: center; margin-bottom: 18px; }
.brand .dot {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: #fff; font-weight: 800; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
}
.brand b { font-size: 1.05rem; letter-spacing: .5px; }
.card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-1); padding: 26px 20px; text-align: center;
}
.ico { font-size: 3.4rem; line-height: 1; margin-bottom: 14px; }
h1 { font-size: 1.16rem; margin-bottom: 8px; }
.sub { font-size: .88rem; color: var(--ink-soft); line-height: 1.9; }
button {
    width: 100%; border: none; border-radius: 999px; padding: 15px 18px;
    font-size: 1.02rem; font-weight: 700; font-family: inherit; cursor: pointer;
    margin-top: 20px; transition: transform .15s ease;
}
button:active { transform: translateY(1px); }
.btn-main { background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff;
            box-shadow: 0 10px 24px -10px rgba(59,130,246,.7); }
.btn-ghost { background: transparent; color: var(--ink-soft);
             border: 1px solid var(--line); margin-top: 10px; font-weight: 600; }
button:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }
.warn {
    background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.32);
    color: #b45309; border-radius: var(--radius-md); text-align: left;
    padding: 12px 15px; font-size: .85rem; line-height: 1.9; margin-top: 18px;
}
html.dark .warn { color: #fbbf24; }
.info {
    background: rgba(59,130,246,.10); border: 1px solid rgba(59,130,246,.30);
    color: #1d4ed8; border-radius: var(--radius-md); text-align: left;
    padding: 12px 15px; font-size: .85rem; line-height: 1.9; margin-top: 18px;
}
html.dark .info { color: #93c5fd; }
.foot { text-align: center; font-size: .74rem; color: var(--ink-faint); margin-top: 18px; line-height: 1.8; }
.hide { display: none !important; }
.log {
    font-family: ui-monospace, Consolas, monospace; font-size: .78rem;
    color: var(--ink-faint); margin-top: 14px; word-break: break-all;
    line-height: 1.7; text-align: left; max-height: 120px; overflow-y: auto;
}
</style>
</head>
<body>
<div class="wrap">

    <div class="brand"><span class="dot">NB</span><span><b>NB频道</b></span></div>

    <!-- 在 APP 里 -->
    <div class="card hide" id="pApp">
        <div class="ico">📷</div>
        <h1>扫一扫</h1>
        <p class="sub">
            对准电脑上那个二维码扫一下。<br>
            扫到之后会自动打开对应的页面。
        </p>
        <button class="btn-main" id="btnScan">开始扫码</button>
        <button class="btn-ghost" onclick="location.href='index-Beta.html'">返回首页</button>

        <div class="info">
            这个按钮只有 NB频道 APP 里才有 —— 网页版没法调摄像头。
        </div>
        <div class="log hide" id="logBox"></div>
    </div>

    <!-- 不在 APP 里 -->
    <div class="card hide" id="pWeb">
        <div class="ico">📱</div>
        <h1>请在 APP 里用「扫一扫」</h1>
        <p class="sub" style="margin-bottom:6px;">
            你现在用的是手机浏览器，它没有扫码功能。<br>
            <b>NB频道 APP 里内置了扫一扫</b>，比在浏览器里方便。
        </p>
        <div class="warn">
            用手机浏览器的话也有办法：<br>
            · <b>手机自带相机</b>（多数机型都带扫码）对着二维码扫<br>
            · 或者在 APP 里点「我的」→「扫一扫」
        </div>
        <button class="btn-main" onclick="location.href='download/index.html'">下载 NB频道 APP</button>
        <button class="btn-ghost" onclick="location.href='index-Beta.html'">返回首页</button>
    </div>

    <div class="foot">NB频道 · 扫一扫</div>
</div>

<script>
/* ============================================================
   扫一扫
   ------------------------------------------------------------
   什么时候能扫：只有在 NB频道 APP 里才调得动摄像头。
   网页版（手机浏览器）没有扫描能力 —— 安卓/iOS 都没给网页开放
   摄像头扫码的稳定接口，所以这个功能只能放原生侧。

   原生那边（MainActivity.java）暴露的是 window.NBQr：
       window.NBQr.available()  → true
       window.NBQr.scan()       → 开摄像头
     扫完原生会调 window.__nbQrResult(ok, data)

   ⚠️ 安全：扫到的内容可能是任意字符串，有可能是恶意二维码。
      绝不能拿到就直接 location.href —— 那等于让任何二维码都能把
      APP 里的用户带到钓鱼站，而且是在 APP 的 WebView 里，看起来很像真的。
      所以下面有一道【域名白名单】，只认我们自己的域名。
   ============================================================ */
(function () {
    'use strict';

    var el = function (id) { return document.getElementById(id); };
    var scanning = false;

    function log(msg) {
        var b = el('logBox');
        if (!b) return;
        b.classList.remove('hide');
        b.textContent = msg;
    }

    function inApp() {
        try {
            return !!(window.NBQr && typeof window.NBQr.available === 'function' && window.NBQr.available());
        } catch (e) { return false; }
    }

    // ⭐ 只允许我们自己的域名。别的域名一律拒绝。
    //   允许的：xxx.nb-channel.top / nb-channel.pages.dev / nbchannel.pythonanywhere.com
    var ALLOW = [
        /^https:\/\/([a-z0-9-]+\.)?nb-channel\.top(\/|$)/i,
        /^https:\/\/([a-z0-9-]+\.)?nb-channel\.pages\.dev(\/|$)/i,
        /^https:\/\/nbchannel\.pythonanywhere\.com(\/|$)/i
    ];
    function allowed(url) {
        for (var i = 0; i < ALLOW.length; i++) if (ALLOW[i].test(url)) return true;
        return false;
    }

    function onResult(ok, data) {
        scanning = false;
        var btn = el('btnScan');
        if (btn) { btn.disabled = false; btn.textContent = '开始扫码'; }

        if (!ok) {
            if (data === 'cancelled') { log('已取消'); return; }
            log('扫码失败：' + data);
            alert('扫码失败：' + data);
            return;
        }
        var text = String(data || '').trim();
        log('扫到：' + text);

        if (!allowed(text)) {
            alert('这个二维码不是 NB频道 的，已忽略。\n\n' + text.slice(0, 120));
            return;
        }
        // 白名单过了才跳
        location.href = text;
    }

    function startScan() {
        if (scanning) return;
        if (!inApp()) { showWeb(); return; }
        scanning = true;
        var btn = el('btnScan');
        btn.disabled = true;
        btn.textContent = '正在打开摄像头…';
        window.__nbQrResult = onResult;
        try {
            window.NBQr.scan();
        } catch (e) {
            scanning = false;
            btn.disabled = false;
            btn.textContent = '开始扫码';
            alert('打不开摄像头：' + ((e && e.message) || e));
        }
    }

    function showApp() {
        el('pWeb').classList.add('hide');
        el('pApp').classList.remove('hide');
        el('btnScan').addEventListener('click', startScan);
    }
    function showWeb() {
        el('pApp').classList.add('hide');
        el('pWeb').classList.remove('hide');
    }

    // 等原生桥就绪 —— addJavascriptInterface 是页面加载前就注入好的，
    // 但 WebView 里脚本执行的时机偶尔会早一点点，所以轮询几次更稳
    var n = 0;
    (function wait() {
        if (inApp()) { showApp(); return; }
        if (n++ > 20) { showWeb(); return; }
        setTimeout(wait, 100);
    })();
})();
</script>
</body>
</html>
