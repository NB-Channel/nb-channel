<script>
/* ===== 跨子域名登录态同步（github. / netlify. 之间互通）=====
   localStorage 是按 origin 隔离的，两个子域名各存各的，所以要借 Cookie 中转。
   Cookie 设 Domain=.nb-channel.top，所有子域名都能读到。

   这里不改页面原本的任何代码 —— 而是劫持 localStorage 的读写：
     · 页面登录时 setItem('nb_session', ...)  → 顺手写一份到 Cookie
     · 页面登出时 removeItem('nb_session')    → 顺手把 Cookie 清掉
     · 页面加载时 Cookie 有、本地没有          → 自动注入进 localStorage
   所以那 57 处登录/登出代码一行都不用动。

   ⚠️ 这意味着 *.nb-channel.top 下任何一个子域名都能读到这个令牌，
      包括 product-storage 那个 Workers。将来新增子域名前先想清楚这件事。 */
(function () {
    try {
        var KEY_S = 'nb_session', KEY_U = 'nb_user';
        var DOMAIN = '.nb-channel.top';
        var MAXAGE = 30 * 86400;

        // 只在 .nb-channel.top 域下才启用（本地开文件、或别的域名访问时保持原样）
        if (location.hostname.indexOf('nb-channel.top') < 0) return;

        function readCookie(n) {
            var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + n + '=([^;]*)'));
            return m ? decodeURIComponent(m[1]) : null;
        }
        function writeCookie(n, v) {
            document.cookie = n + '=' + encodeURIComponent(v) + ';path=/;domain=' + DOMAIN +
                              ';max-age=' + MAXAGE + ';SameSite=Lax' +
                              (location.protocol === 'https:' ? ';Secure' : '');
        }
        function dropCookie(n) {
            document.cookie = n + '=;path=/;domain=' + DOMAIN + ';max-age=0;SameSite=Lax' +
                              (location.protocol === 'https:' ? ';Secure' : '');
        }

        // ---- ① 页面加载时双向对齐 ----
        [KEY_S, KEY_U].forEach(function (k) {
            var c = readCookie(k), l = null;
            try { l = localStorage.getItem(k); } catch (e) {}
            if (l) {
                if (l !== c) writeCookie(k, l);            // 本地有 → 同步出去
            } else if (c) {
                try { localStorage.setItem(k, c); } catch (e) {}   // 本地没有 → 采用 Cookie
            }
        });

        // ---- ② 劫持写入：登录时同步到 Cookie ----
        var _set = localStorage.setItem;
        localStorage.setItem = function (k, v) {
            try { if ((k === KEY_S || k === KEY_U) && v) writeCookie(k, v); } catch (e) {}
            return _set.call(localStorage, k, v);
        };

        // ---- ③ 劫持删除：登出时同步清 Cookie ----
        var _rm = localStorage.removeItem;
        localStorage.removeItem = function (k) {
            try { if (k === KEY_S || k === KEY_U) dropCookie(k); } catch (e) {}
            return _rm.call(localStorage, k);
        };

        // ---- ④ 万一有人用 clear() ----
        var _cl = localStorage.clear;
        localStorage.clear = function () {
            try { dropCookie(KEY_S); dropCookie(KEY_U); } catch (e) {}
            return _cl.call(localStorage);
        };
    } catch (e) {}
})();
</script>

<script>
    // ===== supabase-js 双源加载(和全站一致) =====
    (function () {
        var srcs = [
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
            'https://unpkg.com/@supabase/supabase-js@2'
        ];
        function load(i) {
            if (i >= srcs.length) { window.__sbFailed = true; return; }
            var s = document.createElement('script');
            s.src = srcs[i];
            s.onload = function () { window.__sbReady = true; };
            s.onerror = function () { load(i + 1); };
            document.head.appendChild(s);
        }
        load(0);
    })();
</script>

<script>
/* ============================================================
   扫码登录 · 手机/设备领取页（方向 B：电脑授权设备）
   ------------------------------------------------------------
   和 qr-login-Beta.html 的区别 —— 别搞混，这是两个相反的方向：

     qr-login-Beta.html   手机【已登录】→ 给电脑授权（电脑登录）
     qr-claim-Beta.html   电脑【已登录】→ 给这台设备发登录（本页登录）

   ⚠️ 本页最要紧的一点：
     二维码里的 code 本身就是登录凭证。谁扫到、谁点确认，
     这台设备就登进那个账号。所以：
       · 有效期只有 90 秒（服务端控制）
       · 一次性
       · 页面必须先显示"你会登成谁"，让人看清再点
       · 明确警告"别扫别人发来的二维码"
   ============================================================ */
(function () {
    'use strict';

    var SB_URL = 'https://pbaafgjkwdbwcmsikcmg.supabase.co';
    var SB_KEY = 'sb_publishable_tv7YVJEisnvs3hvU8ImYUw_b0p6bmRg';

    var el = function (id) { return document.getElementById(id); };
    var code = (new URLSearchParams(location.search).get('c') || '')
                .replace(/[^0-9A-Fa-f]/g, '').toUpperCase();

    // 微信 / QQ / 支付宝内置浏览器检测。
    // 为什么必须提示：这些内置浏览器的 localStorage 和系统浏览器不互通 ——
    // 用户在里面"登录成功"了，切回系统浏览器打开 NB频道 还是没登录，
    // 会以为功能坏了。其实是我们没提醒他"在浏览器打开"。
    (function () {
        var ua = '';
        try { ua = navigator.userAgent || ''; } catch (e) {}
        if (/MicroMessenger|QQ\/|QQBrowser|AlipayClient|Weibo|DingTalk/i.test(ua)) {
            var w = el('wxWarn');
            if (w) w.classList.remove('hide');
        }
    })();

    function show(id) {
        ['pLoading', 'pError', 'pConfirm', 'pDone'].forEach(function (p) {
            el(p).classList.toggle('hide', p !== id);
        });
    }
    function fail(msg) { el('errMsg').textContent = msg; show('pError'); }

    function rpc(fn, body) {
        return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
            method: 'POST',
            headers: {
                apikey: SB_KEY,
                Authorization: 'Bearer ' + SB_KEY,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body || {})
        }).then(function (r) {
            if (!r.ok) throw new Error('接口请求失败 HTTP ' + r.status);
            return r.json();
        });
    }

    function waitSb(cb) {
        var n = 0;
        (function loop() {
            if (window.__sbReady || window.__sbFailed || n++ > 60) { cb(); return; }
            setTimeout(loop, 100);
        })();
    }

    function boot() {
        if (!code || code.length !== 16) {
            fail('二维码里的信息不完整。请回到电脑上重新生成一张。');
            return;
        }
        waitSb(function () {
            rpc('qr_grant_info', { p_code: code }).then(function (d) {
                if (!d || !d.ok) { fail((d && d.reason) || '二维码无效'); return; }

                el('dvName').textContent = d.username_masked || '(未知)';
                var sec = Number(d.expires_in) || 0;
                el('dvTtl').textContent = sec > 0
                    ? '这张码还有 ' + sec + ' 秒有效'
                    : '即将过期，请让电脑上刷新一个';
                show('pConfirm');

                var busy = false;
                el('btnOk').onclick = function () {
                    if (busy) return;
                    busy = true;
                    el('btnOk').disabled = true;
                    el('btnNo').disabled = true;
                    var ua = '';
                    try { ua = navigator.userAgent || ''; } catch (e) {}
                    rpc('qr_grant_claim', { p_code: code, p_ua: ua }).then(function (r) {
                        if (!r || !r.ok) {
                            busy = false;
                            el('btnOk').disabled = false;
                            el('btnNo').disabled = false;
                            fail((r && r.reason) || '登录失败');
                            return;
                        }
                        try { localStorage.setItem('nb_session', r.token); } catch (e) {}
                        try {
                            localStorage.setItem('nb_user', JSON.stringify({ id: r.id, username: r.username }));
                        } catch (e) {}
                        el('doneMsg').innerHTML = '已登录为 <b>' + (r.username || '') + '</b>';
                        show('pDone');
                        el('goHome').onclick = function () { location.href = 'index-Beta.html'; };
                        // 3 秒后自动进首页
                        setTimeout(function () { location.href = 'index-Beta.html'; }, 3000);
                    }).catch(function (e) {
                        busy = false;
                        el('btnOk').disabled = false;
                        el('btnNo').disabled = false;
                        fail(e.message);
                    });
                };
                el('btnNo').onclick = function () { location.href = 'index-Beta.html'; };
            }).catch(function (e) { fail(e.message); });
        });
    }

    boot();
})();
</script>
