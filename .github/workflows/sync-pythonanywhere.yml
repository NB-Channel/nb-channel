name: Sync PythonAnywhere

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 敲一下 PythonAnywhere 的同步接口
        env:
          PA_SYNC_KEY: ${{ secrets.PA_SYNC_KEY }}
        run: |
          if [ -z "$PA_SYNC_KEY" ]; then
            echo "没有配 PA_SYNC_KEY，跳过"
            exit 0
          fi
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            "https://nbchannel.pythonanywhere.com/__sync?k=$PA_SYNC_KEY")
          echo "HTTP $code"
          cat /tmp/out.json || true
          if [ "$code" != "200" ]; then
            echo "同步失败（HTTP $code）"
            exit 1
          fi
