name: Build Android APK

# 触发方式:
#   1) 手动:仓库 → Actions → Build Android APK → Run workflow
#   2) 推送时自动:改动 app/ 目录下的文件
# 构建产物会发布到 Releases,手机直接点链接下载安装。
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Generate app icons & splash
        working-directory: app
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0f172a' --splashBackgroundColor '#0f172a'

      - name: Capacitor sync
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        working-directory: app/android
        run: ls -lh app/build/outputs/apk/debug/

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "out/NB频道-v1.0.${{ github.run_number }}.apk"
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NB频道-APK
          path: out/*.apk

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: NB频道 APP v1.0.${{ github.run_number }}
          body: |
            ## NB频道 安卓客户端

            **安装方法**:下载下面的 `NB频道-v1.0.${{ github.run_number }}.apk` → 手机上点开安装 →
            如果提示"未知来源",允许一次即可。

            - 本 APP 是**官网的客户端外壳**,内容与 https://github.nb-channel.top/Beta/index-Beta.html 完全一致
            - 网站更新后 APP **自动同步**,不用重新下载
            - 构建时间:${{ github.event.repository.updated_at }}
          files: out/*.apk
          draft: false
          prerelease: false
